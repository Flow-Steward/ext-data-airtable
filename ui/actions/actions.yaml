{
  "actions": [
    {
      "action_id": "list_records",
      "workflow_visible": true,
      "title": "List a page of table records",
      "description": "Read up to 100 Airtable records, optionally matching a formula. Pass the returned offset to another call to read the next page.",
      "required_scopes": [
        "extension:invoke"
      ],
      "handler": {
        "mode": "extension"
      },
      "parameters": [
        {
          "name": "connection_ref",
          "type": "string",
          "required": true
        },
        {
          "name": "table",
          "type": "string",
          "required": true
        },
        {
          "name": "page_size",
          "type": "integer",
          "required": false
        },
        {
          "name": "offset",
          "type": "string",
          "required": false
        },
        {
          "name": "filter_by_formula",
          "type": "string",
          "required": false
        }
      ],
      "result_fields": [
        "result.records",
        "result.count",
        "result.offset"
      ],
      "error_codes": [
        "invalid_payload",
        "invalid_connection",
        "effect_claim_required",
        "test_mode_suppressed",
        "provider_unavailable",
        "invalid_provider_response",
        "response_too_large",
        "network_blocked",
        "timeout",
        "authentication_failed",
        "not_found",
        "conflict",
        "rate_limited",
        "partial_write"
      ],
      "mutates_platform": false
    },
