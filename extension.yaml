{
  "manifest_version": 2,
  "extension_id": "flowsteward.airtable",
  "kind": "tool_provider",
  "version": "1.0.1",
  "release_stage": "active",
  "display_name": "Airtable",
  "description": "Airtable bounded table record REST reads and writes.",
  "lifecycle": {
    "data_schema_version": 1,
    "data_migrations": []
  },
  "vendor": {
    "name": "Flow Steward"
  },
  "listing": {
    "category": "data",
    "tags": [
      "airtable",
      "database",
      "rest"
    ],
    "summary": "Table record CRUD for workflows."
  },
  "features": [
    "tool",
    "action"
  ],
  "required_scopes": [
    "extension:invoke"
  ],
  "egress": {
    "hosts": [
      "api.airtable.com"
    ]
  },
  "account_scope": {
    "scope_type": "project",
    "description": "Explicit project database connection."
  },
  "entrypoint": {
    "mode": "subprocess",
    "command": [
      "python3",
      "main.py"
    ],
    "timeout_seconds": 40
  },
  "health": {
    "command": [
      "python3",
      "health.py"
    ],
    "timeout_seconds": 5
  },
  "ui_manifest": "ui/ui_manifest.yaml",
  "action_manifest": "ui/actions/actions.yaml",
  "python_requirements": [],
  "runtime": {
    "contract_version": "extension_host_v2",
    "compatibility": {
      "platform_min": "1.4.0"
    },
    "extension_contract_v2": {
      "connection_types": "contracts/connection_types.yaml",
      "operation_manifest": "contracts/operation_manifest.yaml",
      "step_ui_manifest": "contracts/step_ui_manifest.yaml"
    }
  },
  "external_effects": [
    {
      "operation_id": "create_records",
      "effect_kind": "database_write",
      "channel": "airtable",
      "idempotency": "required",
      "test_mode_behavior": "suppress"
    },
    {
      "operation_id": "delete_records",
      "effect_kind": "database_write",
      "channel": "airtable",
      "idempotency": "required",
      "test_mode_behavior": "suppress"
    },
    {
      "operation_id": "update_records",
      "effect_kind": "database_write",
      "channel": "airtable",
      "idempotency": "required",
      "test_mode_behavior": "suppress"
    },
    {
      "operation_id": "upsert_records",
      "effect_kind": "database_write",
      "channel": "airtable",
      "idempotency": "required",
      "test_mode_behavior": "suppress"
    }
  ],
  "machine_auth": {
    "service_account_key": "svc_ext_airtable",
    "required_scopes": [
      "extension:invoke"
    ]
  }
}
