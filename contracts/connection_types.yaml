{
  "connection_types": [
    {
      "connection_type_id": "airtable",
      "display_name": "Airtable",
      "description": "Fixed HTTPS provider origin. Credentials grant direct database access.",
      "config_schema": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "base_id"
        ],
        "properties": {
          "base_id": {
            "type": "string",
            "pattern": "^app[A-Za-z0-9]{14}$"
          },
          "request_timeout_seconds": {
            "type": "integer",
            "minimum": 1,
            "maximum": 30,
            "default": 15
          }
        }
      },
      "secret_schema": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "personal_access_token"
        ],
        "properties": {
          "personal_access_token": {
            "type": "string",
            "minLength": 1,
            "maxLength": 8192
          }
        }
      },
      "capabilities": {
        "test_connection": false,
        "live_request": true,
        "workflow_trigger": false,
        "callback_ingress": false
      },
      "safety_profile": {
        "requires_https": true,
        "requires_host_allowlist": true,
        "stores_secret_values": false
      }
    }
  ]
}
