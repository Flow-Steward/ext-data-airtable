{
  "operations": [
    {
      "operation_id": "list_records",
      "display_name": "List a page of table records",
      "description": "Read up to 100 Airtable records, optionally matching a formula. Pass the returned offset to another call to read the next page.",
      "operation_kind": "action",
      "workflow_visible": true,
      "connection_type_ids": [
        "airtable"
      ],
      "category": "data",
      "inputs": [
        {
          "name": "connection_ref",
          "value_type": "connection_ref",
          "required": true,
          "display_name": "Project connection"
        },
        {
          "name": "table",
          "value_type": "text",
          "required": true,
          "display_name": "Table name or ID",
          "schema": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128
          }
        },
        {
          "name": "page_size",
          "value_type": "integer",
          "required": false,
          "display_name": "Records per page",
          "schema": {
            "type": "integer",
            "minimum": 1,
            "maximum": 100,
            "default": 100
          }
        },
        {
          "name": "offset",
          "value_type": "text",
          "required": false,
          "display_name": "Next-page offset",
          "schema": {
            "type": "string",
            "maxLength": 4096
          }
        },
        {
          "name": "filter_by_formula",
          "value_type": "text",
          "required": false,
          "display_name": "Airtable formula filter",
          "schema": {
            "type": "string",
            "maxLength": 8192
          }
        }
      ],
      "outputs": [
        {
          "name": "records",
          "value_type": "json"
        },
        {
          "name": "count",
          "value_type": "integer"
        },
        {
          "name": "offset",
          "value_type": "text"
        }
      ],
      "result_fields": [
        "result.records",
        "result.count",
        "result.offset"
      ],
      "error_codes": [
        "invalid_payload",
        "invalid_connection",
        "effect_claim_required",
        "test_mode_suppressed",
        "provider_unavailable",
        "invalid_provider_response",
        "response_too_large",
        "network_blocked",
        "timeout",
        "authentication_failed",
        "not_found",
        "conflict",
        "rate_limited",
        "partial_write"
      ]
    },
